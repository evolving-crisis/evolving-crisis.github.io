<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio Chaito</title>
<link rel="stylesheet" href="./styles.css">
<script src="./app.js" defer></script>
</head>
<body>
<main>
  <h1>Your page content here</h1>
  <p>The player is a fixed, full-width footer, 60 px tall. Press play to tune in; the "live" position comes from the clock, so every visitor hears the same moment. This demo uses synthesized audio (a voice-like and a music-like signal) so the visualizer works without files.</p>
</main>

<div id="panel">
  <label>Mode <select id="mode"><option value="auto">Auto (by program)</option><option value="voice">Voice · waves</option><option value="music">Music · bars</option></select></label>
  <label>Accent <input type="color" id="accent" value="#cb4b16"></label>
  <label>Bars <input type="range" id="bars" min="12" max="64" step="1"></label>
  <label>Sensitivity <input type="range" id="sens" min="0.5" max="2.5" step="0.1"></label>
  <label>Smoothing <input type="range" id="smooth" min="0.3" max="0.95" step="0.05"></label>
</div>

<footer id="bar">
  <div id="prog"></div>
  <div class="brand"><div class="logo"><i></i></div>
    <div><div class="name" id="bname"></div><div class="now" id="now"><span></span></div></div></div>
  <div class="ctl">
    <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
    <button id="play" aria-label="Play"><svg viewBox="0 0 24 24"><path id="ic" d="M8 5v14l11-7z"/></svg></button>
    <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg></button>
    <button id="live" aria-label="Back to live">LIVE</button>
  </div>
  <canvas id="viz"></canvas>
  <div class="right">
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    <button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10v2H4zm12 0h4v2h-4zM4 15h4v2H4zm6 0h10v2H10zM14 5h2v6h-2zM8 13h2v6H8z"/></svg></button>
  </div>
</footer>

<audio id="aud" crossorigin="anonymous" preload="none"></audio>
</body>
</html>
