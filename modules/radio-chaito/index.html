<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf6e3">
<title>Radio Chaito</title>
<link rel="stylesheet" href="./styles.css">
<script src="./app.js" defer></script>
</head>
<body>
<main class="scene">
  <div class="scene-orbit" aria-hidden="true"></div>
</main>

<div id="panel" aria-label="Player settings">
  <label>Mode <select id="mode"><option value="auto">Auto (by program)</option><option value="voice">Voice · waves</option><option value="music">Music · bars</option><option value="helix">Helix · organelles</option></select></label>
  <label>Accent <input type="color" id="accent" value="#cb4b16"></label>
  <label>Bars <input type="range" id="bars" min="12" max="64" step="1"></label>
  <label>Sensitivity <input type="range" id="sens" min="0.5" max="2.5" step="0.1"></label>
  <label>Smoothing <input type="range" id="smooth" min="0.3" max="0.95" step="0.05"></label>
</div>

<footer id="bar" aria-label="Radio player">
  <svg class="anatomy" viewBox="0 0 460 72" preserveAspectRatio="none" aria-hidden="true">

      <path d="M91 36l2-3 M98 41l3-3 M195 34l2-3 M202 42l3-3 M292 34l2-3 M299 42l3-3 M387 35l2-3 M394 42l3-3"/>

    <g class="cilia">
      <path d="M38 23 32 12m26 9-2-12m30 12 4-10m29 10 8-11m25 10 3-11m31 11 8-10m25 10 2-12m29 13 7-10m27 10 3-11m30 11 8-9m24 10 2-12m29 13 7-10m27 10 5-11m27 13 8-9"/>
      <path d="m42 49-7 10m35-8-3 11m34-11-8 10m37-10-2 12m32-12-8 10m37-10-4 12m32-12-8 10m36-11-2 12m34-12-8 10m35-10-4 12m33-12-7 10m32-10-2 11m30-11-7 9"/>

    <path class="gut" d="M18 38 C42 31 52 46 75 38 S110 30 131 38 S168 47 190 38 S226 29 249 38 S286 47 308 38 S344 30 366 38 S405 47 451 37"/>

  </svg>
  <div id="prog" role="progressbar" aria-label="Audio progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="100% remaining">
    <svg class="progress-line" viewBox="0 0 100 12" preserveAspectRatio="none" aria-hidden="true">
      <path class="progress-track" d="M1 6 C4 5.5 5 3.4 8.2 4.1 S12.7 8.2 16.1 6.4 S21.5 2.8 25 4.3 S30.4 8.6 34.1 6.2 S39.7 3.2 43.4 5.1 S48.9 8.4 52.3 6.3 S57.8 3.2 61.2 4.8 S66.7 8.2 70.2 6.1 S75.5 3.4 79 5 S84 8.5 87.6 6 S94 3.5 99 5.6"/>

    </svg>
  </div>
  <div class="brand">
    <div class="name" id="bname">420 pb chaïto</div>
    <div class="now" id="now"><span></span></div>
  </div>
  <div class="ctl">
    <button id="prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
    <button id="play" aria-label="Play radio" aria-pressed="false">
      <span class="cell-mark" aria-hidden="true"><i></i></span>
      <svg viewBox="0 0 24 24"><path id="ic" d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg></button>
    <button id="live" aria-label="Back to live">LIVE</button>
  </div>
  <canvas id="viz" aria-hidden="true"></canvas>
  <div class="right">
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    <button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10v2H4zm12 0h4v2h-4zM4 15h4v2H4zm6 0h10v2H10zM14 5h2v6h-2zM8 13h2v6H8z"/></svg></button>
  </div>
  <button id="fold" aria-label="Collapse radio player" aria-expanded="true" aria-keyshortcuts="Escape">
    <svg class="fold-nucleus" viewBox="0 0 40 40" aria-hidden="true">
      <g class="nucleus-organism">
        <path class="nucleus-envelope" d="M18.8 3.2c3.3-.1 5 2 7.6 3.1 2.3 1.1 6-.6 7.7 1.8 2 2.8-.8 5.2-2.4 7.1-1.5 1.8-.2 4 3.1 5 2.2.7 1.2 3.7-1 5.1-2.3 1.4-5.1.4-7.5 2-2.1 1.4-2.3 4.7-4.5 6.6-2.6 2.2-5-.7-7.4-3-2.2-2-5.2-.4-7.7-1.9-2.8-1.7-1.4-4.8-.3-7 .8-1.6-2.3-3.4-3.3-5.6-1.6-3 1-5.3 3.8-5.9 2.5-.6 2.4-3.3 4.2-5.2 1.9-2.2 4.3-3.3 7.7-3.1Z"/>

          <path class="accessory-crista" d="M26.9 13.6c.5-.8.9.8 1.4 0s.9-.8 1.4 0"/>
          <ellipse class="accessory-vesicle" cx="20.2" cy="30.2" rx="2.5" ry="1.2"/>
          <circle class="accessory-granule" cx="9.8" cy="13.6" r="1"/>
          <circle class="accessory-granule" cx="29.1" cy="24.3" r=".85"/>
        </g>
        <path class="nucleus-inner-envelope" d="M19.3 6.1c4.5-.1 6.7 2.2 8.7 4 2.3 2 1.3 4.7-.4 6.4-1.5 1.6.1 3.2 1.5 4.4 1.7 1.5-.1 3.6-2.4 4.1-2 .4-3.1.1-4.7 2-1.5 1.8-2.8 2.5-4.8.6-1.8-1.7-3.1-2.6-5.4-2.7-2.6-.1-3.6-2.3-2.4-4.4 1.1-1.8-.9-3.1-2-4.7-1.4-2 .2-3.8 2.5-4.5 2-.6 2.5-2.5 4.2-4 1.5-1.4 3.1-1.8 5.2-1.7Z"/>
        <path class="nucleus-membrane" d="M11 12.6c2.8-3.1 7.8-4.2 11.6-2.5m7 8.1c-.1 4.2-3.5 7.7-7.8 8.2"/>
        <g class="nucleus-endosymbiont">
          <ellipse class="endosymbiont-envelope" cx="12.2" cy="21.4" rx="3.1" ry="2.1"/>
          <ellipse class="endosymbiont-inner-envelope" cx="12.2" cy="21.4" rx="2.3" ry="1.35"/>
          <path class="endosymbiont-crista" d="M10.3 21.4c.6-1.2 1.2 1.1 1.8 0s1.2-1 1.8 0"/>
        </g>
        <ellipse class="nucleus-core" cx="20" cy="20" rx="6.1" ry="5.1"/>
        <g class="nucleus-daughters">
          <ellipse cx="15" cy="20" rx="2.2" ry="2.8"/>
          <ellipse cx="25" cy="20" rx="2.2" ry="2.8"/>
          <path d="m14.1 18.7 1.8 2.6m-.1-2.6-1.6 2.6m9.9-2.6 1.8 2.6m-.1-2.6-1.6 2.6"/>
        </g>
      </g>
      <path class="play-icon" d="M18 16v8l7-4z"/>
      <path class="pause-icon" d="M17 16h2.5v8H17zm4.5 0H24v8h-2.5z"/>
    </svg>
  </button>
</footer>

<audio id="aud" crossorigin="anonymous" preload="none"></audio>
</body>
</html>
