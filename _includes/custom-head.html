<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="alternate icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('{{ "/service-worker.js" | relative_url }}')
        .catch(error => console.warn('Offline support could not be enabled.', error));
    });
  }
</script>
