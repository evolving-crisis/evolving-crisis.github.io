<style>
  .radio-chaito-header {
    grid-area: radio;
    display: block;
    width: 100%;
    min-width: 0;
    height: 55px;
    margin: 0;
    border: 0;
    vertical-align: middle;
  }

  .site-header .wrapper {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    grid-template-areas: "radio title nav";
    align-items: center;
    gap: clamp(8px, 1.5vw, 20px);
  }

  .site-header .site-title {
    grid-area: title;
    float: none;
    justify-self: center;
    min-width: 0;
  }

  .site-header .site-nav {
    grid-area: nav;
    float: none;
    justify-self: center;
    min-width: 0;
  }

  @media screen and (max-width: 900px) {
    .site-header .wrapper {
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 8px;
    }
  }

  @media screen and (max-width: 720px) {
    .site-header .wrapper {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "title nav"
        "radio radio";
      gap: 4px 12px;
    }

    .radio-chaito-header {
      height: 54px;
    }

    .site-header .site-title {
      justify-self: start;
    }

    .site-header .site-nav {
      position: relative;
      top: auto;
      right: auto;
      justify-self: end;
    }
  }
</style>

<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>

    <nav class="site-nav">
      <input type="checkbox" id="nav-trigger">
      <label for="nav-trigger">
        <span class="menu-icon"></span>
      </label>

      <div class="nav-items">
        {% for path in site.header_pages %}
          {% assign my_page = site.pages | where: "path", path | first %}
          {% if my_page.title %}
            <a class="nav-item" href="{{ my_page.url | relative_url }}">{{ my_page.title | escape }}</a>
          {% endif %}
        {% endfor %}
      </div>
    </nav>

    <iframe
      class="radio-chaito-header"
      src="{{ '/modules/radio-chaito/?embed=header' | relative_url }}"
      title="420 pb chaïto radio player"
      allow="autoplay"
    ></iframe>
  </div>
</header>

<script>
  window.addEventListener('message', event => {
    if (event.origin !== window.location.origin ||
        !['pomoudying:radio', 'studyping:radio'].includes(event.data?.type) ||
        !['on', 'off'].includes(event.data.action)) return;

    const studyPing = document.querySelector('.pomoudying-fullscreen iframe, .studyping-fullscreen iframe');
    const radio = document.querySelector('.radio-chaito-header');
    if (!studyPing || event.source !== studyPing.contentWindow || !radio) return;

    radio.contentWindow.postMessage({ type: 'radio-chaito:command', action: event.data.action }, window.location.origin);
  });
</script>
