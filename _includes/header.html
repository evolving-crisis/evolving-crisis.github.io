<style>
  .radio-chaito-header {
    order: 2;
    flex: 1 1 auto;
    min-width: 0;
    height: 55px;
    margin: 0 18px;
    border: 0;
    vertical-align: top;
  }

  .site-header .wrapper {
    display: flex;
    align-items: center;
  }

  .site-header .site-title {
    float: none;
    flex: 0 0 auto;
  }

  .site-header .site-nav {
    order: 3;
    float: none;
    flex: 0 0 auto;
  }

  @media screen and (max-width: 900px) {
    .radio-chaito-header {
      margin-left: 10px;
    }
  }

  @media screen and (max-width: 600px) {
    .radio-chaito-header {
      order: 3;
      display: block;
      width: 100%;
      height: 54px;
      margin: 0;
      clear: both;
    }

    .site-header .wrapper {
      display: block;
    }

    .site-header .site-nav {
      order: initial;
    }
  }
</style>

<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>

    <nav class="site-nav">
      <input type="checkbox" id="nav-trigger">
      <label for="nav-trigger">
        <span class="menu-icon"></span>
      </label>

      <div class="nav-items">
        {% for path in site.header_pages %}
          {% assign my_page = site.pages | where: "path", path | first %}
          {% if my_page.title %}
            <a class="nav-item" href="{{ my_page.url | relative_url }}">{{ my_page.title | escape }}</a>
          {% endif %}
        {% endfor %}
      </div>
    </nav>

    <iframe
      class="radio-chaito-header"
      src="{{ '/modules/radio-chaito/?embed=header' | relative_url }}"
      title="Radio Chaito player"
      allow="autoplay"
    ></iframe>
  </div>
</header>

<script>
  window.addEventListener('message', event => {
    if (event.origin !== window.location.origin ||
        event.data?.type !== 'studyping:radio' ||
        !['on', 'off'].includes(event.data.action)) return;

    const studyPing = document.querySelector('.studyping-fullscreen iframe');
    const radio = document.querySelector('.radio-chaito-header');
    if (!studyPing || event.source !== studyPing.contentWindow || !radio) return;

    radio.contentWindow.postMessage({ type: 'radio-chaito:command', action: event.data.action }, window.location.origin);
  });
</script>
